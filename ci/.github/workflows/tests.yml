# GitHub Actions workflow for the pytest suite.
# INSTALL: move to .github/workflows/tests.yml (web UI: Actions -> set up a
# workflow yourself -> paste).  It lives here because the repo-scope push
# token cannot create files under .github/workflows (needs `workflow` scope).
name: tests
on: [push, pull_request]
jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt
        # standalone packaging: plain pinned requirements, no poetry needed
      - run: python -m pytest tests/ -q
