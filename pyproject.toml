[build-system]
requires = ["setuptools>=59.6", "wheel>=0.37"]
build-backend = "setuptools.build_meta"

[project]
name = "emfin-v2"
version = "2.0.0"
description = "Standalone scenario-based funding-risk engine with cumulative payouts"
readme = "README.md"
requires-python = ">=3.10,<3.14"
authors = [{name = "Tijs de Boer"}]
dependencies = ["numpy==2.2.6", "pandas==2.3.3", "scipy==1.15.3", "cvxpy==1.7.5"]

[project.scripts]
emfin-run = "emfin_v2.default_run:main"
emfin-explore = "emfin_v2.explorer:main"

[tool.setuptools]
license-files = ["NOTICE.md", "legacy/ATTRIBUTION.md"]

[tool.setuptools.packages.find]
include = ["emfin_v2*", "emfin_capstone*"]
exclude = ["legacy*", "tests*"]

[tool.setuptools.package-data]
emfin_v2 = ["resources/configs/*.json", "resources/data/snapshot/*", "resources/data/raw/*.json", "resources/data/raw/fred/*/*.csv", "web/*.html"]
